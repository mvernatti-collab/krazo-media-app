<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wrestling Graphics Remote · Krazo Media</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
<style>
:root{--red:#E31B23;--bg:#0c0c0f;--card:#17171c;--line:#2b2b32;--mute:#9a9aa3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:#fff;font-family:-apple-system,Helvetica,Arial,sans-serif}
.H{font-family:Anton,Impact,sans-serif;text-transform:uppercase;letter-spacing:.02em;font-weight:400}
header{position:sticky;top:0;z-index:5;background:#0c0c0ff2;border-bottom:1px solid var(--line);padding:8px 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
header img{height:28px}
.pill{font:700 11px -apple-system,Arial;letter-spacing:.06em;text-transform:uppercase;padding:5px 9px;border-radius:999px;background:#222229;color:#bbb}
.pill.ok{background:#12351f;color:#7ee2a0}.pill.bad{background:#3a1414;color:#ff9a9a}.pill.warn{background:#3a2e10;color:#ffd27a}
.sp{flex:1}
main{padding:12px;max-width:1200px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.full{grid-column:1/-1}
.lbl{font:700 12px -apple-system,Arial;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:2px 0 10px}
button,input{font:inherit;color:#fff;background:#24242b;border:1px solid #34343c;border-radius:10px;padding:10px 12px}
button{cursor:pointer;touch-action:manipulation}
button:active{transform:scale(.97)}
button.live{background:var(--red);border-color:var(--red)}
.big{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.big button{padding:20px 8px;font-size:18px;font-weight:700}
.big button span{display:block;font-size:12px;font-weight:400;color:#ddd;margin-top:4px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input{width:100%}
.pre{display:grid;gap:6px;margin-top:10px}
.pre button{text-align:left;padding:10px 12px}
.pre button small{display:block;color:var(--mute)}
.now{font-size:28px;line-height:1.1}
.now small{display:block;font:14px -apple-system,Arial;color:var(--mute);text-transform:none;letter-spacing:0;margin-top:4px}
.pv{position:relative;width:100%;aspect-ratio:16/9;background:#3d5a2e;border-radius:10px;overflow:hidden}
.pv iframe{position:absolute;left:0;top:0;width:1920px;height:1080px;border:0;transform-origin:0 0}
@media (max-width:820px){main{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <img src="/pt/krazo.png" alt="Krazo Media">
  <div class="H" style="font-size:22px">Graphics Remote</div>
  <div class="sp"></div>
  <div class="pill" id="pLink">Connecting</div>
  <div class="pill" id="pOver">Overlay ?</div>
</header>
<main>
  <div class="card full"><div class="now H" id="now">Waiting for the scorer…</div></div>

  <div class="card">
    <div class="lbl">Stream graphics</div>
    <div class="big">
      <button id="gBug">Scorebug<span id="gBugS">on</span></button>
      <button id="gNext">Up next<span>matchup + records</span></button>
      <button id="gDual">Dual summary<span>all bouts</span></button>
      <button id="gClear">Hide all cards<span>back to the bug</span></button>
    </div>
    <div class="row" style="margin-top:10px">
      <button onclick="window.open('/pt/control.html','_blank')">Explainer clips panel ↗</button>
      <span style="color:var(--mute);font-size:13px">rules, scoring and penalty explainers</span>
    </div>
  </div>

  <div class="card">
    <div class="lbl">Lower third</div>
    <input id="lt1" placeholder="Top line, e.g. JAKE MILLER">
    <input id="lt2" placeholder="Second line, e.g. 2025 State qualifier · 14-2" style="margin-top:6px">
    <div class="row" style="margin-top:8px">
      <button id="ltShow" class="live">Show</button>
      <button id="ltHide">Hide</button>
      <button id="ltSave" style="margin-left:auto">Save as preset</button>
    </div>
    <div class="pre" id="auto"></div>
    <div class="pre" id="saved"></div>
  </div>

  <div class="card full">
    <div class="lbl">Overlay preview</div>
    <div class="pv" id="pv"><iframe id="pvf" src="/pt/wrestle/overlay.html?preview=1" title="Overlay preview"></iframe></div>
  </div>
</main>
<script type="module">
import { write, listen, read } from "/pt/pt-sync.js";
import { DOC, RESULTS, periodById, remaining, fmtClock, unpack, pack, defaultState } from "/pt/wrestle/core.js";
import { GFX, blankGfx, loadDuals, buildStats, recOf } from "/pt/wrestle/records.js";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let S = defaultState(), G = blankGfx(), STATS = new Map();

const wt = () => S.weights[S.idx];
const lu = () => S.lineup[wt()] || { h: "", a: "" };
const rec = (s) => recOf(STATS, (s === "h" ? S.home : S.away).name, lu()[s]);

function send() { G.v = Date.now(); paint(); write(GFX, pack(G)).catch(() => alert("Couldn't send. Check connection.")); }
function setShow(fn) { fn(G.show); send(); }
$("gBug").onclick = () => setShow((g) => (g.bug = !g.bug));
$("gNext").onclick = () => { G.rec = { wt: wt(), h: rec("h"), a: rec("a") }; setShow((g) => { g.next = !g.next; if (g.next) { g.dual = false; g.lt = false; } }); };
$("gDual").onclick = () => setShow((g) => { g.dual = !g.dual; if (g.dual) { g.next = false; g.lt = false; } });
$("gClear").onclick = () => setShow((g) => { g.next = false; g.dual = false; g.lt = false; });
function showLt(t, s) { G.lt = { title: t, sub: s }; $("lt1").value = t; $("lt2").value = s; setShow((g) => { g.lt = true; g.next = false; g.dual = false; }); }
$("ltShow").onclick = () => showLt($("lt1").value.trim(), $("lt2").value.trim());
$("ltHide").onclick = () => setShow((g) => (g.lt = false));

// saved presets (this device)
const loadP = () => { try { return JSON.parse(localStorage.getItem("krazo-lt-presets")) || []; } catch { return []; } };
const saveP = (l) => { try { localStorage.setItem("krazo-lt-presets", JSON.stringify(l)); } catch {} };
$("ltSave").onclick = () => { const t = $("lt1").value.trim(); if (!t) return; const l = loadP(); l.push({ t, s: $("lt2").value.trim() }); saveP(l); paintPresets(); };
function paintPresets() {
  $("saved").innerHTML = loadP().map((p, i) => `<div class="row"><button style="flex:1;text-align:left" data-p="${i}">${esc(p.t)}<small>${esc(p.s)}</small></button><button data-px="${i}" aria-label="Remove preset">×</button></div>`).join("");
}
$("saved").onclick = (e) => {
  const b = e.target.closest("button"); if (!b) return;
  const l = loadP();
  if (b.dataset.px) { l.splice(+b.dataset.px, 1); saveP(l); paintPresets(); }
  else if (b.dataset.p) showLt(l[+b.dataset.p].t, l[+b.dataset.p].s);
};
$("auto").onclick = (e) => { const b = e.target.closest("[data-a]"); if (!b) return; const [t, s] = JSON.parse(b.dataset.a); showLt(t, s); };

function paint() {
  $("gBug").classList.toggle("live", !!G.show.bug); $("gBugS").textContent = G.show.bug ? "on" : "off";
  $("gNext").classList.toggle("live", !!G.show.next); $("gDual").classList.toggle("live", !!G.show.dual);
  $("ltShow").textContent = G.show.lt ? "Update" : "Show";
  $("ltHide").classList.toggle("live", false);
  const n = lu(), m = S.m;
  $("now").innerHTML = `${esc(wt())} lbs · ${esc(n.h || S.home.short)} ${m.h} – ${m.a} ${esc(n.a || S.away.short)} · ${periodById(m.period).label} ${fmtClock(remaining(m))}
    <small>Dual: ${esc(S.home.name)} ${S.team.h} – ${S.team.a} ${esc(S.away.name)} · bout ${S.idx + 1} of ${S.weights.length}</small>`;
  // one-tap lower thirds built from live data
  const items = [];
  for (const s of ["h", "a"]) { const t = s === "h" ? S.home : S.away; if (n[s]) items.push([n[s], `${t.name} · ${wt()} lbs${rec(s) ? " · " + rec(s) : ""}`]); }
  items.push([`${S.home.name} ${S.team.h} – ${S.team.a} ${S.away.name}`, `Dual score after ${S.bouts.length} bout${S.bouts.length === 1 ? "" : "s"}`]);
  const last = S.bouts[S.bouts.length - 1];
  if (last) { const w = last.w === "h" ? last.hn || S.home.name : last.an || S.away.name; items.push([`${w} wins`, `${RESULTS[last.type].label}${last.type === "FALL" ? " · " + last.time : last.score ? " · " + last.score : ""} · ${last.wt} lbs · +${last.tp} ${(last.w === "h" ? S.home : S.away).short}`]); }
  $("auto").innerHTML = '<div class="lbl" style="margin:6px 0 0">From the match</div>' + items.map(([t, s]) => `<button data-a="${esc(JSON.stringify([t, s]))}">${esc(t)}<small>${esc(s)}</small></button>`).join("");
}
setInterval(() => { if (S.m.running) paint(); }, 500);

// preview scaling
const fit = () => { const w = $("pv").clientWidth; $("pvf").style.transform = `scale(${w / 1920})`; };
addEventListener("resize", fit); fit();

listen(DOC, (d) => { const s = unpack(d); if (s) { S = s; paint(); } }, (st) => { const p = $("pLink"); p.className = "pill " + (st === "live" ? "ok" : st === "polling" ? "warn" : "bad"); p.textContent = st === "live" ? "Live link" : st === "polling" ? "Backup link" : "No connection"; });
listen(GFX, (d) => { const g = unpack(d); if (!g) return; const b = blankGfx(); G = { ...b, ...g, show: { ...b.show, ...(g.show || {}) }, lt: { ...b.lt, ...(g.lt || {}) } }; paint(); }, () => {}, 2000);
let lastBeat = 0, prevAlive;
listen("wrestle-status", (d) => { if (!d) return; if (prevAlive !== undefined && d.alive !== prevAlive) lastBeat = performance.now(); prevAlive = d.alive; }, () => {}, 3000);
setInterval(() => { const ok = lastBeat && performance.now() - lastBeat < 15000; const p = $("pOver"); p.className = "pill " + (ok ? "ok" : "bad"); p.textContent = ok ? "Overlay online" : "Overlay offline"; }, 1000);
const refresh = async () => { STATS = buildStats(await loadDuals().catch(() => [])); paint(); };
refresh(); setInterval(refresh, 60000);
paintPresets(); paint();
</script>
</body>
</html>
