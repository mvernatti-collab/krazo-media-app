<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wrestling Stats">
<link rel="apple-touch-icon" href="/pt/krazo.png">
<meta name="theme-color" content="#0c0c0f">
<title>Wrestling Stats · Krazo Media</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
<style>
:root{--red:#ED1C24;--bg:#0c0c0f;--card:#17171c;--line:#2b2b32;--mute:#9a9aa3}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#fff;font-family:-apple-system,Helvetica,Arial,sans-serif}
.H{font-family:Anton,Impact,sans-serif;text-transform:uppercase;letter-spacing:.02em;font-weight:400}
header{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
header img{height:28px}
main{padding:14px;max-width:1300px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:14px;overflow:auto}
.lbl{font:700 12px -apple-system,Arial;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:2px 0 10px}
button,select,input{font:inherit;color:#fff;background:#24242b;border:1px solid #34343c;border-radius:10px;padding:8px 12px}
button{cursor:pointer}
table{width:100%;border-collapse:collapse;font-size:14px;white-space:nowrap}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right}
th:first-child,td:first-child,th.l,td.l{text-align:left}
th{color:var(--mute);font-size:11px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;user-select:none}
th.on{color:#fff}
tr.click{cursor:pointer}tr.click:hover td{background:#20202a}
td.w{color:#7ee2a0;font-weight:700}
.sp{flex:1}
.kpi{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.kpi div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-width:140px}
.kpi b{display:block;font-family:Anton,Impact,sans-serif;font-weight:400;font-size:34px}
.kpi span{color:var(--mute);font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.mrow{cursor:pointer}.mrow:hover td{background:#20202a}.mrow.open td{background:#20202a}
.mrow td:last-child::after{content:" ▸";color:var(--mute)}.mrow.open td:last-child::after{content:" ▾"}
td.bdc{padding:0 !important;white-space:normal;text-align:left}
.bd{padding:14px;background:#111116;border-bottom:1px solid var(--line);display:grid;gap:14px}
.bd .hd{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.bd .hd b{font:400 26px Anton,Impact,sans-serif;text-transform:uppercase}
.bd .hd span{color:var(--mute);font-size:13px}
.bd table{width:auto;font-size:14px}
.bd th,.bd td{padding:5px 10px;text-align:center;border-bottom:1px solid var(--line)}
.bd th:first-child,.bd td:first-child{text-align:left}
.bd .me{color:#7ee2a0}.bd .op{color:#ff8a8f}
.bd .tl{display:grid;grid-template-columns:42px 52px 1fr 56px;gap:4px 10px;font-size:14px;max-width:640px}
.bd .tl div{padding:4px 0;border-bottom:1px solid #1f1f26}
.bd .tl .m{color:var(--mute)}
.bd .tl .sc{text-align:right;font-family:Anton,Impact,sans-serif;font-size:16px}
.bd .two{display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start}
</style>
</head>
<body>
<header>
  <img src="/pt/krazo.png" alt="Krazo Media">
  <div class="H" style="font-size:22px">Wrestling Stats</div>
  <div class="sp"></div>
  <label>Team <select id="fTeam"><option value="">All teams</option></select></label>
  <input id="fQ" placeholder="Search wrestler" size="16">
  <button id="csv">Download CSV</button>
  <button id="reload">Refresh</button>
</header>
<main>
  <div id="st" style="color:var(--mute);font-size:13px;margin:0 2px 10px"></div>
  <div class="kpi" id="kpi"></div>
  <div class="card"><div class="lbl">Wrestlers <span style="text-transform:none;letter-spacing:0">· click a column to sort, click a wrestler for their matches</span></div><table id="wTbl"></table></div>
  <div class="card" id="detail" style="display:none"></div>
  <div class="card"><div class="lbl">Duals</div><table id="dTbl"></table></div>
  <div class="card" id="box" style="display:none"></div>
</main>
<script type="module">
import { RESULTS, PERIODS, periodById, derive, fmtClock, other } from "/pt/wrestle/core.js";
import { loadDuals, buildStats } from "/pt/wrestle/records.js";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let DUALS = [], ROWS = [], sortKey = "W", sortDir = -1;

const COLS = [
  ["name", "Wrestler", "l"], ["team", "Team", "l"], ["wt", "Wt", "l"], ["rec", "Record"], ["W", "W"], ["L", "L"],
  ["FALL", "Pins"], ["TF", "TF"], ["MD", "MD"], ["DEC", "Dec"], ["FOR", "Forf"],
  ["TD", "TD"], ["E", "Esc"], ["R", "Rev"], ["NF", "NF"], ["NFp", "NF pts"], ["pf", "Pts for"], ["pa", "Pts agst"],
  ["stall", "Stall"], ["pen", "Pen"], ["tp", "Team pts"],
];

async function load() {
  $("wTbl").innerHTML = "<tr><td>Loading…</td></tr>";
  $("st").textContent = "Loading saved duals…";
  DUALS = await loadDuals();
  const i = loadDuals.info || {};
  $("st").innerHTML = i.error ? `<span style="color:#ff9a9a">${esc(i.error)}. Check the internet connection and tap Refresh.</span>`
    : !i.listed ? "No saved duals yet. Finish a match in the scorer (tap a result under End match), or load test data from the Broadcast Hub."
    : `${i.loaded} saved dual${i.loaded === 1 ? "" : "s"} · updated ${new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })}` + (i.missing && i.missing.length ? ` · ${i.missing.length} listed but never saved (${i.missing.map((d) => esc((d.date || "") + " " + (d.home || "") + " vs " + (d.away || ""))).join(", ")})` : "") + (i.failed && i.failed.length ? ` · ${i.failed.length} couldn't be read (connection)` : "");
  build();
}
function build() {
  ROWS = [...buildStats(DUALS).values()];
  const teams = [...new Set(ROWS.map((r) => r.team))].sort();
  const cur = $("fTeam").value;
  $("fTeam").innerHTML = '<option value="">All teams</option>' + teams.map((t) => `<option ${t === cur ? "selected" : ""}>${esc(t)}</option>`).join("");
  if (!cur && teams.includes("Ozark")) $("fTeam").value = "Ozark";
  draw();
}
function filtered() {
  const t = $("fTeam").value, q = $("fQ").value.trim().toLowerCase();
  return ROWS.filter((r) => (!t || r.team === t) && (!q || r.name.toLowerCase().includes(q)));
}
function draw() {
  const rows = filtered().sort((a, b) => {
    const x = a[sortKey], y = b[sortKey];
    if (sortKey === "wt") return sortDir * ((parseFloat(x) || 0) - (parseFloat(y) || 0));
    return typeof x === "string" ? sortDir * x.localeCompare(y) : sortDir * (x - y) || b.W - a.W;
  });
  $("wTbl").innerHTML = `<tr>${COLS.map(([k, l, c]) => `<th data-k="${k}" class="${c || ""} ${k === sortKey ? "on" : ""}">${l}${k === sortKey ? (sortDir > 0 ? " ▲" : " ▼") : ""}</th>`).join("")}</tr>` +
    rows.map((r, i) => `<tr class="click" data-i="${ROWS.indexOf(r)}">${COLS.map(([k, , c]) => `<td class="${c || ""}">${k === "name" ? "<b>" + esc(r[k]) + "</b>" : esc(r[k])}</td>`).join("")}</tr>`).join("") ||
    `<tr><td class="l">No bouts recorded yet. Finish a match in the scorer and it shows up here.</td></tr>`;
  const t = $("fTeam").value, ds = DUALS.filter((d) => !t || d.home.name === t || d.away.name === t);
  let dw = 0, dl = 0; ds.forEach((d) => { const us = t ? (d.home.name === t ? "h" : "a") : "h"; const them = us === "h" ? "a" : "h"; if (d.team[us] > d.team[them]) dw++; else if (d.team[us] < d.team[them]) dl++; });
  const sum = (k) => rows.reduce((n, r) => n + r[k], 0);
  $("kpi").innerHTML = (t ? `<div><b>${dw}-${dl}</b><span>${esc(t)} dual record</span></div>` : `<div><b>${ds.length}</b><span>Duals</span></div>`) +
    `<div><b>${sum("W")}-${sum("L")}</b><span>Bout record</span></div><div><b>${sum("FALL")}</b><span>Pins</span></div><div><b>${sum("TD")}</b><span>Takedowns</span></div><div><b>${sum("NF")}</b><span>Near falls</span></div>`;
  $("dTbl").innerHTML = `<tr><th class="l">Date</th><th class="l">Dual</th><th>Score</th><th>Bouts</th></tr>` + ds.map((d) =>
    `<tr class="click" data-dual="${d.id}"><td class="l">${esc(d.date)}</td><td class="l">${esc(d.home.name)} vs ${esc(d.away.name)}</td><td>${d.team.h}–${d.team.a}</td><td>${(d.bouts || []).length}</td></tr>`).join("") || `<tr><td class="l">No duals saved yet.</td></tr>`;
}
$("wTbl").addEventListener("click", (e) => {
  const th = e.target.closest("th"); if (th) { const k = th.dataset.k; if (sortKey === k) sortDir *= -1; else { sortKey = k; sortDir = ["name", "team", "wt"].includes(k) ? 1 : -1; } return draw(); }
  const tr = e.target.closest("tr[data-i]"); if (!tr) return;
  const r = ROWS[+tr.dataset.i];
  $("detail").style.display = "block";
  const ms = r.m.slice().sort((a, b) => (b.date || "").localeCompare(a.date || ""));
  $("detail").innerHTML = `<div class="lbl">${esc(r.name)} · ${esc(r.team)} · ${r.rec} <span style="text-transform:none;letter-spacing:0">· tap a match for the full breakdown</span></div><table id="mTbl"><tr><th class="l">Date</th><th class="l">Wt</th><th class="l">Opponent</th><th class="l">Result</th></tr>` +
    ms.map((m, i) => `<tr class="mrow" data-mi="${i}"><td class="l">${esc(m.date)}</td><td class="l">${esc(m.wt)}</td><td class="l">${esc(m.opp)} <span style="color:var(--mute)">${esc(m.oppTeam)}</span></td><td class="l ${m.won ? "w" : ""}">${m.won ? "W" : "L"} · ${RESULTS[m.type].label}${m.type === "FALL" ? " " + esc(m.time) : m.score ? " " + esc(m.score) : ""}</td></tr>`).join("") + "</table>";
  $("mTbl").onclick = (ev) => {
    const row = ev.target.closest(".mrow"); if (!row) return;
    const nx = row.nextElementSibling;
    if (nx && nx.classList.contains("bdr")) { nx.remove(); row.classList.remove("open"); return; }
    row.classList.add("open");
    row.insertAdjacentHTML("afterend", `<tr class="bdr"><td class="bdc" colspan="4">${breakdown(r, ms[+row.dataset.mi])}</td></tr>`);
  };
  $("detail").scrollIntoView({ behavior: "smooth", block: "nearest" });
});
// Everything about one match: result, points by period, move counts, and every action.
function breakdown(r, m) {
  const d = DUALS.find((x) => x.id === m.dual), b = d && (d.bouts || []).find((x) => x.wt === m.wt);
  if (!b) return `<div class="bd">This match's details weren't saved.</div>`;
  const me = m.side || (b.hn === r.name ? "h" : "a"), op = other(me);
  const nameOf = (s) => (s === me ? r.name : m.opp), teamOf = (s) => (s === "h" ? d.home : d.away).name;
  const res = `${m.won ? "Won" : "Lost"} · ${RESULTS[b.type].label}${b.type === "FALL" ? " at " + esc(b.time) : b.score ? " " + esc(b.score) : ""}`;
  const head = `<div class="hd"><b class="${m.won ? "me" : "op"}">${res}</b><span>${esc(r.name)} (${esc(teamOf(me))}) vs ${esc(m.opp)} (${esc(teamOf(op))}) · ${esc(m.wt)} lbs · ${esc(d.date)}</span></div>`;
  if (b.type === "FOR" || !(b.ev || []).length) return `<div class="bd">${head}<div style="color:var(--mute)">${b.type === "FOR" ? "Forfeit, so no match was wrestled." : "No scoring actions were recorded for this match."}</div></div>`;
  const list = derive(b.ev).list;
  // points by period
  const per = {}, order = [];
  for (const e of list) { if (!per[e.p]) { per[e.p] = { [me]: 0, [op]: 0 }; order.push(e.p); } if (e.pts > 0) per[e.p][e.to] += e.pts; }
  order.sort((x, y) => PERIODS.findIndex((p) => p.id === x) - PERIODS.findIndex((p) => p.id === y));
  const tot = (s) => order.reduce((n, p) => n + per[p][s], 0);
  const perT = `<table><tr><th></th>${order.map((p) => `<th>${periodById(p).label}</th>`).join("")}<th>Total</th></tr>` +
    [me, op].map((s) => `<tr><td class="${s === me ? "me" : "op"}">${esc(nameOf(s))}</td>${order.map((p) => `<td>${per[p][s]}</td>`).join("")}<td><b>${tot(s)}</b></td></tr>`).join("") + "</table>";
  // move counts
  const cnt = (s, f) => list.filter((e) => f(e) && e.s === s).length;
  const rows = [["Takedowns", (e) => e.k === "TD"], ["Escapes", (e) => e.k === "E"], ["Reversals", (e) => e.k === "R"], ["Near falls", (e) => e.k.startsWith("NF")], ["Stalling calls", (e) => e.k === "STALL"], ["Penalties / cautions", (e) => e.k === "PEN" || e.k === "CAUT"]];
  const nfp = (s) => list.filter((e) => e.k.startsWith("NF") && e.s === s).reduce((n, e) => n + e.pts, 0);
  const cntT = `<table><tr><th></th><th class="me">${esc(r.name.split(" ")[0])}</th><th class="op">${esc(String(m.opp).split(" ")[0])}</th></tr>` +
    rows.map(([l, f]) => `<tr><td>${l}</td><td>${cnt(me, f)}${l === "Near falls" && nfp(me) ? ` <span style="color:var(--mute)">(${nfp(me)} pts)</span>` : ""}</td><td>${cnt(op, f)}${l === "Near falls" && nfp(op) ? ` <span style="color:var(--mute)">(${nfp(op)} pts)</span>` : ""}</td></tr>`).join("") + "</table>";
  // every action, scored from this wrestler's side
  const tl = list.filter((e) => e.k !== "POS" || e.pick || e.s !== "N" || e.p !== "1").map((e) => {
    const who = e.k === "POS" ? (e.ch || null) : ["STALL", "PEN", "CAUT"].includes(e.k) ? e.s : e.to;
    const txt = e.k === "POS" ? (e.pick ? e.txt : e.s === "N" ? "Neutral start" : nameOf(e.s) + " on top") : e.txt;
    return `<div class="m">${periodById(e.p).label}</div><div class="m">${fmtClock(e.c ?? 0)}</div><div>${who ? `<b class="${who === me ? "me" : "op"}">${esc(nameOf(who))}</b> ` : ""}${esc(txt)}</div><div class="sc">${e[me]}–${e[op]}</div>`;
  }).join("");
  const end = `<div class="m"></div><div class="m">${b.type === "FALL" ? esc(b.time) : ""}</div><div><b class="${m.won ? "me" : "op"}">${esc(nameOf(m.won ? me : op))}</b> wins · ${RESULTS[b.type].label}</div><div class="sc">${b[me] ?? tot(me)}–${b[op] ?? tot(op)}</div>`;
  return `<div class="bd">${head}<div class="two">${perT}${cntT}</div><div class="tl">${tl}${end}</div></div>`;
}
$("dTbl").addEventListener("click", (e) => {
  const tr = e.target.closest("tr[data-dual]"); if (!tr) return;
  const d = DUALS.find((x) => x.id === tr.dataset.dual);
  $("box").style.display = "block";
  $("box").innerHTML = `<div class="lbl">${esc(d.date)} · ${esc(d.home.name)} ${d.team.h} – ${d.team.a} ${esc(d.away.name)}</div><table><tr><th class="l">Wt</th><th class="l">${esc(d.home.name)}</th><th class="l">${esc(d.away.name)}</th><th class="l">Result</th><th>Team pts</th></tr>` +
    (d.bouts || []).map((b) => `<tr><td class="l">${esc(b.wt)}</td><td class="l ${b.w === "h" ? "w" : ""}">${esc(b.hn || "Open")}</td><td class="l ${b.w === "a" ? "w" : ""}">${esc(b.an || "Open")}</td><td class="l">${RESULTS[b.type].label}${b.type === "FALL" ? " " + esc(b.time) : b.score ? " " + esc(b.score) : ""}</td><td>+${b.tp} ${esc((b.w === "h" ? d.home : d.away).short)}</td></tr>`).join("") + "</table>";
  $("box").scrollIntoView({ behavior: "smooth", block: "nearest" });
});
$("fTeam").onchange = draw; $("fQ").oninput = draw; $("reload").onclick = load;
$("csv").onclick = () => {
  const rows = filtered(), q = (v) => `"${String(v).replace(/"/g, '""')}"`;
  const txt = [COLS.map((c) => q(c[1])).join(",")].concat(rows.map((r) => COLS.map(([k]) => q(r[k])).join(","))).join("\n");
  const a = Object.assign(document.createElement("a"), { href: URL.createObjectURL(new Blob([txt], { type: "text/csv" })), download: `wrestling-stats-${$("fTeam").value || "all"}.csv` });
  a.click();
};
load();
</script>
</body>
</html>
