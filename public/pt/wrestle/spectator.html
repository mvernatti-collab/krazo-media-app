<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tigers Live">
<link rel="apple-touch-icon" href="/pt/wrestle/img/ozark-paw.png">
<meta name="theme-color" content="#0c0c0f">
<title>Live Wrestling · Ozark Tigers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
<style>
:root{--red:#ED1C24;--bg:#0c0c0f;--card:#17171c;--line:#2b2b32;--mute:#9a9aa3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:#fff;font-family:-apple-system,Helvetica,Arial,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.H{font-family:Anton,Impact,sans-serif;text-transform:uppercase;letter-spacing:.02em;font-weight:400}
main{max-width:640px;margin:0 auto;padding:12px}
.top{display:flex;align-items:center;gap:8px;margin:2px 2px 12px}
.top img{height:22px}.top span{color:var(--mute);font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:700}
.live{margin-left:auto;font:800 11px -apple-system,Arial;letter-spacing:.12em;padding:4px 8px;border-radius:999px;background:var(--red)}
.live.off{background:#2a2a31;color:#aaa}
.dual{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.dual .bar{height:6px;display:flex}.dual .bar div{flex:1}
.dual .row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:14px 12px 10px;gap:6px}
.dual .tm{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.dual .tm img,.dual .tm .ph{width:64px;height:56px;object-fit:contain}
.dual .tm .ph{display:flex;align-items:center;justify-content:center;font:400 22px Anton,Impact,sans-serif}
.dual .tm .n{font-size:18px;line-height:1.05}
.dual .sc{font-size:64px;line-height:1;display:flex;gap:10px;align-items:center}
.dual .sc i{font-style:normal;color:#555;font-size:40px}
.dual .msg{text-align:center;color:#ffd27a;font-size:14px;font-weight:700;padding:0 12px 12px}
.bout{margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px}
.bout .hd{display:flex;align-items:center;gap:8px}
.bout .hd .wt{font-size:26px}
.bout .hd .clk{margin-left:auto;font-size:34px;font-variant-numeric:tabular-nums}
.bout .hd .clk.run{color:#7ee2a0}
.bout .hd .per{color:var(--mute);font-size:18px}
.w{display:grid;grid-template-columns:8px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.w:first-of-type{border-top:0}
.w .b{height:46px;border-radius:3px}
.w .n{min-width:0}
.w .n b{display:block;font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.w .n span{color:var(--mute);font-size:13px}
.w .n em{font-style:normal;font:800 10px -apple-system,Arial;letter-spacing:.1em;background:#fff;color:#000;padding:2px 6px;border-radius:4px;margin-left:6px;vertical-align:2px}
.w .p{font-size:46px;line-height:1;min-width:52px;text-align:right}
.ev{margin-top:6px;font-size:14px;color:#d6d6dc}
.ev div{padding:6px 0;border-top:1px solid var(--line);display:flex;gap:8px}
.ev div span{color:var(--mute);min-width:76px}
h3{font:700 12px -apple-system,Arial;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:18px 4px 8px}
.res{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.res div{display:grid;grid-template-columns:48px 1fr 1fr;gap:8px;padding:10px 12px;border-top:1px solid var(--line);font-size:14px;align-items:center}
.res div:first-child{border-top:0}
.res div.cur{background:#20202a}
.res .wt{font:400 18px Anton,Impact,sans-serif;color:#ff6a70}
.res .win{color:#7ee2a0;font-weight:700}
.res small{display:block;color:var(--mute);font-size:12px;font-weight:400}
footer{color:#666;text-align:center;font-size:12px;margin:20px 0 8px}
</style>
</head>
<body>
<main>
  <div class="top"><img src="/pt/krazo.png" alt="Krazo Media"><span>Live wrestling</span><div class="live off" id="live">Connecting</div></div>
  <div class="dual" id="dual"></div>
  <div class="bout" id="bout"></div>
  <h3>Results</h3>
  <div class="res" id="res"></div>
  <footer>Scores from the official table · Krazo Media</footer>
</main>
<script type="module">
import { listen } from "/pt/pt-sync.js";
import { DOC, RESULTS, periodById, remaining, fmtClock, unpack, defaultState, derive, bandHex, makeSkew, CLOCK, makeSkews, localize, liveClock } from "/pt/wrestle/core.js";
import { logoSrc } from "/pt/wrestle/records.js";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const SK = makeSkew(), SKC = makeSkews();
let S = defaultState(), CL = null, got = false, LG = { h: "", a: "" }, lk = "";
const team = (s) => (s === "h" ? S.home : S.away);
const resTxt = (b) => RESULTS[b.type].label + (b.type === "FALL" ? " " + b.time : b.score ? " " + b.score : "");

async function logos() { const k = JSON.stringify([S.home, S.away]); if (k === lk) return; lk = k; [LG.h, LG.a] = await Promise.all([logoSrc(S.home), logoSrc(S.away)]); paint(); }
function paint() {
  if (!got) return;
  const F = S.flip ? "a" : "h", Sd = F === "h" ? "a" : "h";
  const W = S.weights, cur = W[S.idx], done = {}; S.bouts.forEach((b) => (done[b.wt] = b));
  const left = W.filter((w) => !done[w]).length, lead = S.team.h - S.team.a, ahead = lead > 0 ? S.home.name : S.away.name;
  const msg = !left ? (lead ? `Final · ${ahead} wins` : "Final · tied") : Math.abs(lead) > left * 6 ? `${ahead} has clinched the dual` : lead ? `${ahead} leads by ${Math.abs(lead)} · ${left} bout${left > 1 ? "s" : ""} left` : `Tied · ${left} bout${left > 1 ? "s" : ""} left`;
  const tm = (s) => `<div class="tm">${LG[s] ? `<img src="${LG[s]}" alt="">` : `<div class="ph" style="background:${team(s).color}">${esc(team(s).short)}</div>`}<div class="n H">${esc(team(s).name)}</div></div>`;
  $("dual").innerHTML = `<div class="bar"><div style="background:${team(F).color}"></div><div style="background:${team(Sd).color}"></div></div>
    <div class="row">${tm(F)}<div class="sc H">${S.team[F]}<i>–</i>${S.team[Sd]}</div>${tm(Sd)}</div><div class="msg">${esc(msg)}</div>`;
  const lu = S.lineup[cur] || {}, pos = S.m.pos, fin = done[cur];
  const row = (s) => `<div class="w"><div class="b" style="background:${bandHex(S.bands[s])}"></div><div class="n"><b>${esc(lu[s] || "Open")}${pos === s && !fin ? "<em>TOP</em>" : ""}</b><span>${esc(team(s).name)}</span></div><div class="p H">${S.m[s]}</div></div>`;
  const d = derive(S.m.ev || []);
  const evs = d.list.filter((e) => e.k !== "POS" && e.k !== "ADJ").slice(-4).reverse().map((e) => { const side = ["STALL", "PEN", "CAUT"].includes(e.k) ? e.s : e.to;
    return `<div><span>${periodById(e.p).label} ${fmtClock(e.c ?? 0)}</span>${esc(lu[side] || team(side).short)} · ${esc(e.txt)}</div>`; }).join("");
  $("bout").innerHTML = `<div class="hd"><div class="wt H">${esc(cur)} lbs</div><div class="per H" id="per">${fin ? "Final" : periodById(S.m.period).label}</div><div class="clk H" id="clk"></div></div>
    ${row(F)}${row(Sd)}${fin ? `<div class="ev"><div><span>Result</span><b>${esc(resTxt(fin))}</b> · +${fin.tp} ${esc(team(fin.w).short)}</div></div>` : evs ? `<div class="ev">${evs}</div>` : ""}`;
  $("res").innerHTML = W.map((w) => { const b = done[w], l = S.lineup[w] || {};
    const cell = (s) => `<span class="${b && b.w === s ? "win" : ""}">${esc(l[s] || "Open")}${b && b.w === s ? `<small>${esc(resTxt(b))} · +${b.tp}</small>` : ""}</span>`;
    return `<div class="${w === cur ? "cur" : ""}"><span class="wt">${esc(w)}</span>${cell(F)}${cell(Sd)}</div>`; }).join("");
  tick(); logos();
}
function tick() {
  const el = $("clk"); if (!el) return;
  const fin = S.bouts.some((b) => b.wt === S.weights[S.idx]);
  if (fin) { el.textContent = ""; return; }
  const c = liveClock(S, CL); el.textContent = fmtClock(remaining(c, c === S.m ? SK.now() : Date.now())); el.classList.toggle("run", !!c.running);
}
setInterval(tick, 200);
// Fans: live link only (cheap on database reads); slower fallback polling if it fails.
listen(DOC, (d) => { if (d) SK.see(d.sent); const s = unpack(d); if (s && (s.v || 0) >= (S.v || 0)) { S = s; got = true; paint(); } },
  (st) => { const e = $("live"); e.className = "live" + (st === "error" ? " off" : ""); e.textContent = st === "error" ? "Offline" : "Live"; }, 5000);
listen(CLOCK, (d) => { if (!d || !d.v) return; SKC.see(d.by, d.sent); if (CL && d.v <= CL.v) return; CL = { ...localize(d, SKC), bout: d.bout }; tick(); }, () => {}, 5000);
</script>
</body>
</html>
